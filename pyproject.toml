[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
markers = [
  "unit: isolated tests without HTTP or subprocesses",
  "integration: FastAPI endpoint tests",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  "app/simulation/*",
  "app/model/training.py",
  "app/replay_build.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
